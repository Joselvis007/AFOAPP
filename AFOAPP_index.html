<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descargar AFOAPP</title><meta name="theme-color" content="#14233e"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#17243b;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:white;border-radius:20px;max-width:430px;padding:36px 28px;text-align:center;box-shadow:0 10px 40px #14233e17;margin:20px}h1{margin:0 0 12px}p{line-height:1.5;color:#4b5870}a{display:block;background:#172b50;color:white;padding:14px 18px;border-radius:12px;text-decoration:none;margin:12px 0;font-weight:700}.secondary{background:#e9eef7;color:#172b50}</style></head><body><main class="card"><h1>Descarga AFOAPP</h1><p id="status">Detectando tu dispositivo para llevarte a la tienda correspondiente…</p><a id="android" href="https://play.google.com/store/apps/details?id=com.indrox.afoapp&amp;hl=es">Descargar para Android</a><a class="secondary" id="ios" href="https://apps.apple.com/pe/app/afoapp/id6762313979">Descargar para iPhone</a></main><script>const ua=navigator.userAgent||'';const android=document.getElementById('android').href;const ios=document.getElementById('ios').href;let dest=null;if(/Android/i.test(ua))dest=android;else if(/iPhone|iPad|iPod/i.test(ua)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)dest=ios;if(dest){document.getElementById('status').textContent='Te estamos redirigiendo. Si no se abre la tienda, pulsa el botón correspondiente.';window.location.replace(dest)}else document.getElementById('status').textContent='Selecciona la tienda de tu dispositivo:';</script></body></html>
